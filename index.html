<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>AXIOM MEGACORE // THE SURVIVAL MATRIX</title>
    <style>
        body { margin: 0; background-color: #030307; color: #00ff66; font-family: 'Courier New', monospace; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; user-select: none; }
        #container { position: relative; border: 2px solid #00ffff; }
        canvas { display: block; }
        .hud { position: absolute; top: 10px; left: 10px; background: rgba(0, 0, 0, 0.85); border: 1px solid #ff00ff; padding: 12px; font-size: 13px; pointer-events: none; }
    </style>
</head>
<body>
    <div id="container">
        <div class="hud">
            <span style="color:#ff0055; font-weight:bold;">¡EVITA QUE LOS AGENTES COLOQUEN SU MATE EN TU NÚCLEO!</span><br>
            TIEMPO DE SOBREVIDA: <span id="timer">0s</span><br>
            ESTADO DEL ESCUDO: <span id="shield">100%</span><br>
            <span style="color:#ffff00;">MUEVE EL RATÓN/DEDO PARA MOVER EL NÚCLEO</span>
        </div>
        <canvas id="axiomCanvas"></canvas>
    </div>
    <script>
        const canvas = document.getElementById('axiomCanvas'); const ctx = canvas.getContext('2d');
        canvas.width = 800; canvas.height = 600;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playHitSound() {
            let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(180, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
            osc.start(); osc.stop(audioCtx.currentTime + 0.15);
        }

        const walls = [
            { x: 150, y: 120, w: 120, h: 120 }, { x: 500, y: 100, w: 140, h: 90 },
            { x: 180, y: 380, w: 110, h: 130 }, { x: 550, y: 350, w: 120, h: 120 }
        ];

        const boids = []; const numBoids = 450;
        for (let i = 0; i < numBoids; i++) {
            boids.push({
                x: Math.random() * canvas.width, y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 4, vy: (Math.random() - 0.5) * 4
            });
        }

        let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
        let shield = 100, startTime = Date.now(), survivalTime = 0, gameOver = false;

        function updateLight(ex, ey) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if(!gameOver) { mouse.x = ex; mouse.y = ey; }
        }
        canvas.addEventListener('mousemove', (e) => { const r = canvas.getBoundingClientRect(); updateLight(e.clientX - r.left, e.clientY - r.top); });
        canvas.addEventListener('touchmove', (e) => { const r = canvas.getBoundingClientRect(); const t = e.touches[0]; updateLight(t.clientX - r.left, t.clientY - r.top); e.preventDefault(); }, {passive: false});

        function loop() {
            if(gameOver) {
                ctx.fillStyle = 'black'; ctx.fillRect(0,0,canvas.width,canvas.height);
                ctx.fillStyle = 'red'; ctx.font = '30px Courier New'; ctx.fillText("NÚCLEO DESTRUIDO // BÚNKER CAÍDO", 160, canvas.height/2);
                return;
            }

            ctx.fillStyle = '#010103'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            survivalTime = Math.floor((Date.now() - startTime) / 1000);
            document.getElementById('timer').innerText = survivalTime + "s";

            // WOW MOMENT: A los 20 segundos la horda duplica su furia
            let hyperMode = survivalTime >= 20;

            // Actualizar horda inteligente
            boids.forEach(boid => {
                let closeDx = 0, closeDy = 0, xVelAvg = 0, yVelAvg = 0, neighbors = 0;

                boids.forEach(other => {
                    let dx = boid.x - other.x, dy = boid.y - other.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < 30 && dist > 0) {
                        if (dist < 8) { closeDx += dx; closeDy += dy; }
                        xVelAvg += other.vx; yVelAvg += other.vy; neighbors++;
                    }
                });

                if (neighbors > 0) {
                    xVelAvg /= neighbors; yVelAvg /= neighbors;
                    boid.vx += (xVelAvg - boid.vx) * 0.05; boid.vy += (yVelAvg - boid.vy) * 0.05;
                }
                boid.vx += closeDx * 0.1; boid.vy += closeDy * 0.1;
                
                // Si entra en HyperMode, los bichos orbitan con agresividad roja directa al centro
                let centerPull = hyperMode ? 0.001 : 0.0002;
                boid.vx += (canvas.width / 2 - boid.x) * centerPull;
                boid.vy += (canvas.height / 2 - boid.y) * centerPull;

                // Colisión con muros rígidos
                walls.forEach(wall => {
                    if (boid.x > wall.x && boid.x < wall.x + wall.w && boid.y > wall.y && boid.y < wall.y + wall.h) {
                        boid.vx = Math.sign(boid.x - (wall.x + wall.w/2)) * 3;
                        boid.vy = Math.sign(boid.y - (wall.y + wall.h/2)) * 3;
                    }
                });

                let speed = Math.sqrt(boid.vx*boid.vx + boid.vy*boid.vy);
                let maxSpeed = hyperMode ? 5.5 : 3.5;
                if (speed > maxSpeed) { boid.vx = (boid.vx / speed) * maxSpeed; boid.vy = (boid.vy / speed) * maxSpeed; }

                boid.x += boid.vx; boid.y += boid.vy;
                if (boid.x < 0) boid.x = canvas.width; if (boid.x > canvas.width) boid.x = 0;
                if (boid.y < 0) boid.y = canvas.height; if (boid.y > canvas.height) boid.y = 0;

                // Comprobamos impacto letal con tu núcleo de luz
                let bdx = boid.x - mouse.x, bdy = boid.y - mouse.y;
                if(Math.sqrt(bdx*bdx + bdy*bdy) < 6) {
                    shield -= 0.5;
                    document.getElementById('shield').innerText = Math.max(0, Math.floor(shield)) + "%";
                    if(Math.random() < 0.1) playHitSound();
                    if(shield <= 0) gameOver = true;
                }
            });

            // Raycasting de Sombras atmosféricas
            const numRays = 120;
            for (let i = 0; i < numRays; i++) {
                let angle = (i * (360 / numRays)) * Math.PI / 180;
                let rayDirX = Math.cos(angle); let rayDirY = Math.sin(angle);
                let maxDist = 200;

                walls.forEach(wall => {
                    let t1 = (wall.x - mouse.x) / rayDirX; let t2 = (wall.x + wall.w - mouse.x) / rayDirX;
                    let t3 = (wall.y - mouse.y) / rayDirY; let t4 = (wall.y + wall.h - mouse.y) / rayDirY;
                    let tmin = Math.max(Math.min(t1, t2), Math.min(t3, t4));
                    let tmax = Math.min(Math.max(t1, t2), Math.max(t3, t4));
                    if (tmax >= tmin && tmin > 0 && tmin < maxDist) maxDist = tmin;
                });
                ctx.strokeStyle = hyperMode ? 'rgba(255, 0, 55, 0.05)' : 'rgba(255, 230, 150, 0.04)';
                ctx.beginPath(); ctx.moveTo(mouse.x, mouse.y); ctx.lineTo(mouse.x + rayDirX * maxDist, mouse.y + rayDirY * maxDist); ctx.stroke();
            }

            // Pintar bichos de la horda
            boids.forEach(boid => {
                let dist = Math.sqrt((boid.x-mouse.x)**2 + (boid.y-mouse.y)**2);
                ctx.fillStyle = dist < 200 ? (hyperMode ? '#ff0033' : '#ffff00') : 'rgba(0, 100, 60, 0.25)';
                ctx.beginPath(); ctx.arc(boid.x, boid.y, 1.8, 0, Math.PI * 2); ctx.fill();
            });

            // Muros
            walls.forEach(wall => {
                ctx.fillStyle = '#0c0c14'; ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
                ctx.strokeStyle = '#00ffff'; ctx.strokeRect(wall.x, wall.y, wall.w, wall.h);
            });

            // Dibujar núcleo vital blanco
            ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 6, 0, Math.PI * 2); ctx.fill();

            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
